spring.application.name=Citizenship Compass

# Local development database. The production profile uses PostgreSQL.
spring.datasource.url=jdbc:h2:file:./data/citizenship_compass
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

server.error.include-message=always

# Override this environment variable outside local development.
app.security.remember-me-key=${REMEMBER_ME_KEY:citizenship-compass-local-development-key}
